[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sic-pi4-attendance"
version = "1.0.0"
description = "Three-camera, voting-based face attendance runtime for Raspberry Pi 4"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "firebase-admin>=6.5,<7",
  "insightface>=0.7.3,<0.8",
  "numpy>=1.26,<2.1",
  "onnx>=1.16,<2",
  "onnxruntime>=1.19,<2",
  "opencv-python-headless>=4.10,<5",
  "python-dotenv>=1.0,<2",
  "python-multipart>=0.0.9,<1",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[project.scripts]
sic-pi4 = "pi4_attendance.service:main"
sic-pi4-prepare-models = "pi4_attendance.tools.prepare_models:main"
sic-pi4-benchmark = "pi4_attendance.tools.benchmark:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

