[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sic-pi4-attendance"
version = "1.0.0"
description = "Realtime biometric-metadata attendance runtime for Raspberry Pi 4"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "firebase-admin>=6.5,<7",
  "insightface>=0.7.3,<0.8",
  "numpy>=2,<3",
  "onnx>=1.16,<2",
  "onnxruntime>=1.23.2,<2",
  "opencv-python-headless>=4.10,<5",
  "Pillow>=10,<13",
  "python-dotenv>=1.0,<2",
  "python-multipart>=0.0.9,<1",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
test = ["pytest>=8,<9", "httpx>=0.27,<1"]

[project.scripts]
sic-pi4 = "pi4_attendance.service:main"
sic-pi4-prepare-models = "pi4_attendance.tools.prepare_models:main"
sic-pi4-benchmark = "pi4_attendance.tools.benchmark:main"
sic-pi4-embeddings = "pi4_attendance.tools.embeddings:main"
sic-pi4-control = "pi4_attendance.tools.console:control_main"
sic-pi4-performance = "pi4_attendance.tools.console:performance_main"
sic-pi4-attendance-log = "pi4_attendance.tools.console:attendance_main"
sic-console = "pi4_attendance.tools.console:console_main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

