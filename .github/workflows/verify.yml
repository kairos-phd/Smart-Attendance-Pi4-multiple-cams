name: Verify Pi dashboard and updater

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  dashboard-and-update:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # Deliberately excludes inference, camera and WebRTC dependencies.
      - run: >-
          python -m pip install 'pytest>=8,<9' 'fastapi>=0.115,<1'
          'httpx>=0.27,<1' 'firebase-admin>=6.5,<8' 'numpy>=2,<3'
          'python-dotenv>=1,<2'
      - run: python -m compileall -q src/pi4_attendance scripts
      - run: >-
          python -m pytest -q tests/test_dashboard_feed.py
          tests/test_dashboard_updater.py tests/test_pi_update.py tests/test_storage.py
